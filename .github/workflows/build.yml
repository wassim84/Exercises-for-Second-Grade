name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk tania-ibtidai.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tania-ibtidai-apk
          path: tania-ibtidai.apk
      # رابط تحميل ثابت للهاتف: آخر نسخة دائمًا في Releases باسم latest
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest tania-ibtidai.apk --title "آخر نسخة" --notes "ثبّت ملف tania-ibtidai.apk على الهاتف." --latest
