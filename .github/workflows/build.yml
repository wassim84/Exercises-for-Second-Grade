name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk tania-ibtidai.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tania-ibtidai-apk
          path: tania-ibtidai.apk
      # رابط تحميل ثابت للهاتف: آخر نسخة دائمًا في Releases باسم latest
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest tania-ibtidai.apk --title "آخر نسخة" --notes "ثبّت ملف tania-ibtidai.apk على الهاتف." --latest

      # ملف AAB موقّع لرفعه على Google Play (يعمل فقط بعد إضافة الأسرار الأربعة في إعدادات المستودع)
      - name: Build signed AAB for Google Play
        if: github.ref == 'refs/heads/main' && env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" ./gradlew bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab tania-ibtidai-play.aab
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        if: hashFiles('tania-ibtidai-play.aab') != ''
        with:
          name: google-play-aab
          path: tania-ibtidai-play.aab
